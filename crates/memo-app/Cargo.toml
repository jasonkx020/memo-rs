[package]
name = "memo-app"
version.workspace = true
edition.workspace = true

[features]
default = ["tray"]
# Windows / macOS / Ubuntu 桌面托盘；无 GTK 的纯服务器可关：
#   cargo build -p memo-cli --no-default-features
tray = ["dep:tray-icon"]

[dependencies]
memo-core = { workspace = true }
memo-sync = { workspace = true }
eframe = { workspace = true }
image = { version = "=0.24.9", default-features = false, features = ["png", "jpeg"] }
uuid = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
lunar_rust = { workspace = true }
chrono-tz = { workspace = true }
raw-window-handle = "0.6"
tray-icon = { workspace = true, optional = true }
# 钉住传递依赖，阻止 Cargo 拉 edition2024 / 高 MSRV 包（1.77 Win7 绿色包）
url = { workspace = true }
idna = { workspace = true }
home = { workspace = true }
proc-macro-crate = { workspace = true }
indexmap = { workspace = true }
hashbrown = { workspace = true }
ahash = { workspace = true }
equivalent = { workspace = true }
base64ct = { workspace = true }
password-hash = { workspace = true }
getrandom = { workspace = true }
fs2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Registry",
] }
# WinRT Toast（进程内调用，不拉起 PowerShell）
windows = { version = "=0.52.0", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Foundation",
] }
