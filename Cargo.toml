[workspace]
resolver = "2"
members = [
    "crates/memo-core",
    "crates/memo-sync",
    "crates/memo-app",
    "crates/memo-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# 全部钉死 2024 年初版本，避免 Cargo 拉到 edition2024 依赖（1.77 无法解析）
[workspace.dependencies]
memo-core = { path = "crates/memo-core" }
memo-sync = { path = "crates/memo-sync" }
memo-app = { path = "crates/memo-app" }

serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.114"
thiserror = "=1.0.58"
anyhow = "=1.0.81"
rand = "=0.8.5"
hex = "=0.4.3"
base64 = "=0.21.7"
sha2 = "=0.10.8"
aes-gcm = "=0.10.3"
argon2 = "=0.5.3"
ed25519-dalek = { version = "=2.1.1", features = ["rand_core"] }
zeroize = { version = "=1.7.0", features = ["derive"] }
zeroize_derive = "=1.4.2"
directories = "=5.0.1"
tokio = { version = "=1.37.0", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
parking_lot = "=0.12.1"
uuid = { version = "=1.8.0", features = ["v4"] }
chrono = { version = "=0.4.35", default-features = false, features = ["clock", "std"] }
clap = { version = "=4.4.18", features = ["derive"] }
eframe = { version = "=0.27.2", default-features = false, features = ["glow", "default_fonts"] }
rpassword = "=7.3.1"
# 强制旧版，避免解析到 edition2024 的 idna_adapter
url = "=2.5.0"
idna = "=0.5.0"
# 继续钉死会污染解析的传递依赖（避免 edition2024）
base64ct = "=1.6.0"
password-hash = "=0.5.0"
digest = "=0.10.7"
crypto-common = "=0.1.6"
generic-array = "=0.14.7"
typenum = "=1.17.0"
getrandom = "=0.2.12"
libc = "=0.2.153"
windows-sys = "=0.52.0"
bitflags = "=2.4.2"
once_cell = "=1.19.0"
ahash = "=0.8.11"
hashbrown = "=0.14.3"
indexmap = "=2.2.5"
equivalent = "=1.0.1"
hashlink = "=0.8.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
